name: Update news

on:
  schedule:
    - cron: "5 * * * *"   # 매시 5분(UTC 기준, 한국 시각도 매시 5분)
  workflow_dispatch:       # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths-ignore: ["news.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect news
        run: python scripts/fetch_news.py news.json

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "Update news $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cp index.html news.json _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
