<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 주요기사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 한 화면 2×2 분야판(스크롤 없음) → 분야를 누르면 기사 전체를 읽는 상세 화면 */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#18202b; --muted:#5b6574; --line:#dde1e7; --hi:#eef1f6;
  --eco:#0f7a6c; --sisa:#b4372f; --estate:#a86410; --policy:#3b4fb0;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151b; --surface:#191f27; --ink:#e7ebf0; --muted:#9aa4b2; --line:#2a323d; --hi:#222a35;
  --eco:#4cc2b0; --sisa:#ee7a70; --estate:#e3a54c; --policy:#8f9ff0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#191f27; --ink:#e7ebf0; --muted:#9aa4b2; --line:#2a323d; --hi:#222a35;
  --eco:#4cc2b0; --sisa:#ee7a70; --estate:#e3a54c; --policy:#8f9ff0; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
html.ov body{overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--policy);outline-offset:2px;border-radius:4px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── 전체 화면 ── */
#overview{height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;padding-block:14px}
.bar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar h1{font-family:var(--display);font-size:clamp(22px,3vw,30px);margin:0;line-height:1.2}
.date{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--muted)}
.bar .hint{margin-left:auto;font-size:13px;color:var(--muted)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.card{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:14px 18px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card:hover{box-shadow:0 2px 14px rgba(20,30,50,.08);border-color:var(--c)}
.card-head{display:flex;align-items:baseline;gap:8px}
.card-head h2{font-family:var(--display);font-size:21px;margin:0;color:var(--c)}
.card-head .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card-head .go{margin-left:auto;font-size:13px;font-weight:600;color:var(--c);text-decoration:none;white-space:nowrap}
.lead{display:block;text-decoration:none;margin-top:8px}
.lead h3{font-family:var(--display);font-size:clamp(17px,1.8vw,20px);line-height:1.4;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead p{margin:4px 0 0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.heads{flex:1;min-height:0;overflow:hidden;list-style:none;margin:10px 0 0;padding:8px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.heads a{display:block;text-decoration:none;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heads a::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:middle}
.heads a:hover,.lead:hover h3{text-decoration:underline;text-underline-offset:3px}
.more{font-size:12.5px;color:var(--muted);padding-top:6px}
@media (max-width:720px){
  .grid{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);gap:8px}
  .card{padding:10px 14px 8px}
  .card-head h2{font-size:18px}
  .lead{margin-top:4px}
  .lead p,.bar .hint{display:none}
  .heads{margin-top:6px;padding-top:6px}
}
@media (max-height:640px) and (min-width:721px){.lead p{display:none}}

/* ── 상세 화면 ── */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.dbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.dbar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:6px;padding-block:10px;overflow-x:auto;scrollbar-width:none}
.btn{flex:none;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.btn.back{font-weight:600}
.btn[aria-current="page"]{background:var(--c);border-color:var(--c);color:var(--bg)}
.sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 4px}
.dmain{max-width:880px;margin:0 auto;padding-block:24px 56px}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.dhead h2{font-family:var(--display);font-size:clamp(28px,4vw,36px);margin:0;color:var(--c)}
.dhead span{color:var(--muted);font-size:14px}
.items{display:flex;flex-direction:column;gap:12px}
article{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:72px;transition:background .6s}
article.top{border-top:3px solid var(--c)}
article.focus{background:var(--hi);border-color:var(--c)}
article h3{font-family:var(--display);font-size:20px;line-height:1.45;margin:0;text-wrap:balance}
article.top h3{font-size:24px}
article p{margin:0;color:var(--muted);max-width:65ch}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;align-items:baseline}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.meta a{color:var(--c);font-weight:600;text-decoration:none}
.meta a:hover{text-decoration:underline}
.dfoot{margin-top:28px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

    <h1>오늘의 주요기사</h1>
    <span class="date" id="date"></span>
    <span class="hint">분야나 기사 제목을 누르면 상세 화면으로 이동합니다</span>

<div id="detail" hidden>
  <div class="dbar"><div class="dbar-in pad" id="dnav"></div></div>

<script>
(function(){
  var data = JSON.parse(document.getElementById('news').textContent);
  var secs = data.sections;
  var d = data.date.split('-');
  var dateText = d[0]+'.'+d[1]+'.'+d[2]+' ('+data.weekday+')';
  document.getElementById('date').textContent = dateText;

  function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;}
  function colorOf(s){return 'var('+s.color+')';}

  /* 전체 화면: 2×2 분야판 */
  var grid = document.getElementById('grid');
  secs.forEach(function(s){
    var card = el('section','card'); card.style.setProperty('--c',colorOf(s));
    card.addEventListener('click',function(e){ if(!e.target.closest('a')) location.hash = s.id; });
    var head = el('div','card-head');
    head.appendChild(el('h2',null,s.name));
    head.appendChild(el('span','n',s.items.length+'건'));
    var go = el('a','go','자세히 보기 →'); go.href='#'+s.id; head.appendChild(go);
    card.appendChild(head);

    var lead = el('a','lead'); lead.href='#'+s.id+'-1';
    lead.appendChild(el('h3',null,s.items[0].title));
    lead.appendChild(el('p',null,s.items[0].summary));
    card.appendChild(lead);

    var ul = el('ul','heads');
    s.items.slice(1).forEach(function(it,i){
      var li = el('li'); var a = el('a',null,it.title); a.href='#'+s.id+'-'+(i+2); a.title=it.title;
      li.appendChild(a); ul.appendChild(li);
    });
    card.appendChild(ul);
    var more = el('div','more'); more.hidden = true; card.appendChild(more);
    grid.appendChild(card);
  });

  /* 칸에 다 안 들어가는 제목은 숨기고 "+N건 더"로 표시 */
  function fit(){
    Array.prototype.forEach.call(grid.children,function(card){
      var ul = card.querySelector('.heads'), more = card.querySelector('.more');
      var lis = ul.children; var hiddenN = 0;
      Array.prototype.forEach.call(lis,function(li){li.hidden=false;});
      more.hidden = true;
      var bottom = ul.getBoundingClientRect().bottom;
      for(var i=lis.length-1;i>=0;i--){
        if(lis[i].getBoundingClientRect().bottom > bottom + 1){ lis[i].hidden = true; hiddenN++; }
      }
      if(hiddenN){
        more.textContent = '+ '+hiddenN+'건 더 · 자세히 보기에서 확인';
        more.hidden = false;
        bottom = ul.getBoundingClientRect().bottom;
        for(var j=lis.length-1;j>=0;j--){
          if(!lis[j].hidden && lis[j].getBoundingClientRect().bottom > bottom + 1){ lis[j].hidden = true; hiddenN++; }
        }
        more.textContent = '+ '+hiddenN+'건 더 · 자세히 보기에서 확인';
      }
    });
  }

  /* 상세 화면 */
  var detail = document.getElementById('detail'), overview = document.getElementById('overview');
  var dnav = document.getElementById('dnav'), dmain = document.getElementById('dmain');
  var back = el('a','btn back','← 전체'); back.href='#'; dnav.appendChild(back);
  dnav.appendChild(el('span','sep'));
  var navBtns = {};
  secs.forEach(function(s){
    var b = el('a','btn',s.name); b.href='#'+s.id; b.style.setProperty('--c',colorOf(s));
    navBtns[s.id]=b; dnav.appendChild(b);
  });

  function renderDetail(s, focusIdx){
    dmain.style.setProperty('--c',colorOf(s));
    dmain.textContent='';
    var head = el('div','dhead');
    head.appendChild(el('h2',null,s.name));
    head.appendChild(el('span',null,dateText+' · '+s.items.length+'건'));
    dmain.appendChild(head);
    var list = el('div','items');
    s.items.forEach(function(it,i){
      var a = el('article', i===0?'top':null); a.id = s.id+'-'+(i+1);
      if(focusIdx===i+1) a.classList.add('focus');
      a.appendChild(el('h3',null,it.title));
      a.appendChild(el('p',null,it.summary));
      var m = el('div','meta');
      m.appendChild(el('span','tag',it.source));
      var link = el('a',null,'원문 보기 ↗'); link.href=it.url; link.target='_blank'; link.rel='noopener';
      m.appendChild(link); a.appendChild(m); list.appendChild(a);
    });
    dmain.appendChild(list);
    dmain.appendChild(el('p','dfoot','요약은 각 언론사 보도를 바탕으로 정리했습니다. 수치와 세부 내용은 원문에서 확인하세요. · 마지막 업데이트 '+data.updated));
    Object.keys(navBtns).forEach(function(k){
      if(k===s.id) navBtns[k].setAttribute('aria-current','page'); else navBtns[k].removeAttribute('aria-current');
    });
  }

  function route(){
    var h = location.hash.replace('#','');
    var m = h.match(/^([a-z]+)(?:-(\d+))?$/);
    var s = m && secs.filter(function(x){return x.id===m[1];})[0];
    if(s){
      var idx = m[2] ? parseInt(m[2],10) : 0;
      renderDetail(s, idx);
      overview.hidden = true; detail.hidden = false;
      document.documentElement.classList.remove('ov');
      if(idx){ var t=document.getElementById(s.id+'-'+idx); if(t) t.scrollIntoView({block:'start'}); }
      else window.scrollTo(0,0);
    } else {
      detail.hidden = true; overview.hidden = false;
      document.documentElement.classList.add('ov');
      window.scrollTo(0,0);
      fit();
    }
  }
  window.addEventListener('hashchange',route);
  window.addEventListener('resize',function(){ if(!overview.hidden) fit(); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(!overview.hidden) fit(); });
  route();
})();
</script>

</body>
</html>
